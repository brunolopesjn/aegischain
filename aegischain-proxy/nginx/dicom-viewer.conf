events {}

http {
    upstream orthanc {
        server 127.0.0.1:8042;
    }

    server {
        listen 8043;

        location /stone-webviewer/ {
            proxy_pass http://orthanc;
            proxy_set_header Host $host;
        }

        location /dicom-web/ {
            proxy_pass http://orthanc;
            proxy_set_header Host $host;
        }

        location /instances {
            proxy_pass http://orthanc;
            proxy_set_header Host $host;
        }
    }
}